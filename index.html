<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Messenger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-main: #0f1014; --bg-sidebar: #181a20; --bg-panel: #1e2128; --bg-input: #242830; --bg-hover: #2a2e37;
      --accent: #3b82f6; --accent-hover: #2563eb; --text-main: #f1f5f9; --text-muted: #64748b;
      --bubble-sent: linear-gradient(135deg, #2563eb, #3b82f6); --bubble-received: #242830;
      --danger: #ef4444; --gold: #f59e0b; --border: rgba(255, 255, 255, 0.05);
      --body-bg: var(--bg-main);
    }
    body.theme-light {
      --bg-main: #ffffff; --bg-sidebar: #f5f5f7; --bg-panel: #e9e9eb; --bg-input: #f0f0f2; --bg-hover: #e5e5e8;
      --accent: #007aff; --accent-hover: #0066d6; --text-main: #000000; --text-muted: #8e8e93;
      --bubble-sent: linear-gradient(135deg, #007aff, #0a84ff); --bubble-received: #e9e9eb;
      --danger: #ff3b30; --gold: #ff9500; --border: rgba(0, 0, 0, 0.08);
    }
    body.theme-wave {
      --bg-main: transparent; --bg-sidebar: rgba(15, 12, 41, 0.85); --bg-panel: rgba(30, 25, 60, 0.9); --bg-input: rgba(255, 255, 255, 0.1); --bg-hover: rgba(255, 255, 255, 0.15);
      --accent: #00f2fe; --accent-hover: #00d2e0; --text-main: #ffffff; --text-muted: #b0b0b0;
      --bubble-sent: linear-gradient(135deg, #4facfe, #00f2fe); --bubble-received: rgba(255, 255, 255, 0.15);
      --danger: #ff0844; --gold: #ffd700; --border: rgba(255, 255, 255, 0.2);
      --body-bg: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400% !important; animation: gradient-wave 15s ease infinite !important;
    }
    @keyframes gradient-wave { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--body-bg); color: var(--text-main); display: flex; justify-content: center; height: 100vh; height: 100dvh; overflow: hidden; }

    #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 20px; position: relative; }
    #auth-screen::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 300px; background: linear-gradient(180deg, var(--accent) 0%, transparent 100%); opacity: 0.1; }
    .auth-card { position: relative; background: var(--bg-sidebar); padding: 40px 30px; border-radius: 20px; width: 100%; max-width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); border: 1px solid var(--border); z-index: 1; }
    .auth-logo { width: 60px; height: 60px; background: var(--accent); border-radius: 18px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; font-weight: 700; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4); }
    .auth-tabs { display: flex; background: var(--bg-input); border-radius: 12px; padding: 4px; margin-bottom: 25px; }
    .tab-btn { flex: 1; padding: 10px; background: transparent; border: none; color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 8px; transition: 0.2s; }
    .tab-btn.active { background: var(--bg-sidebar); color: var(--text-main); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 13px; font-weight: 500; }
    .input-group input { width: 100%; padding: 16px; background: var(--bg-input); border: 1px solid transparent; border-radius: 12px; color: var(--text-main); font-size: 16px; outline: none; }
    .input-group input:focus { border-color: var(--accent); }
    .btn-primary { width: 100%; padding: 16px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }

    #app-container { display: none; flex-direction: column; width: 100%; max-width: 1200px; height: 100%; }
    #top-nav { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); flex-shrink: 0; height: 56px; z-index: 20; }
    .nav-logo { color: var(--text-main); font-weight: 700; font-size: 16px; }
    .nav-actions { display: flex; gap: 6px; align-items: center; }
    .nav-btn { background: transparent; border: none; color: var(--text-muted); width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 12px; transition: 0.2s; }
    .nav-btn:hover { color: var(--text-main); background: var(--bg-hover); }
    .nav-btn.creator-btn { color: var(--gold); display: none; }
    .nav-btn.creator-btn:hover { color: var(--gold); background: rgba(245, 158, 11, 0.1); }
    .nav-btn.logout-btn:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

    #main-content { flex: 1; display: flex; overflow: hidden; position: relative; }
    .sidebar { width: 340px; background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border); height: 100%; flex-shrink: 0; }
    .sidebar-header { padding: 15px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .sidebar-header h2 { font-size: 20px; font-weight: 700; }
    .search-input-wrap { position: relative; display: flex; align-items: center; background: var(--bg-input); border-radius: 10px; margin: 12px 16px; }
    .search-input-wrap input { width: 100%; padding: 12px 40px 12px 36px; background: transparent; border: none; border-radius: 10px; color: var(--text-main); outline: none; font-size: 15px; }
    .search-btn-right { position: absolute; right: 6px; background: var(--accent); border: none; color: white; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    
    .chat-list { flex: 1; overflow-y: auto; padding: 8px; }
    .chat-item { padding: 12px; cursor: pointer; display: flex; gap: 12px; align-items: center; border-radius: 12px; margin-bottom: 4px; }
    .chat-item:hover { background: var(--bg-hover); }
    .chat-item.active { background: var(--bg-panel); }
    .chat-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 600; color: white; flex-shrink: 0; overflow: hidden; font-size: 18px; }
    .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-info { flex: 1; overflow: hidden; }
    .chat-name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-last { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .user-profile { padding: 12px 16px; background: var(--bg-panel); display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--border); }
    .profile-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-hover); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; overflow: hidden; cursor: pointer; border: 2px solid var(--accent); flex-shrink: 0; }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-info { flex: 1; overflow: hidden; cursor: pointer; }
    .profile-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .crown-icon { fill: var(--gold); transition: all 0.3s; filter: drop-shadow(0 0 2px rgba(245, 158, 11, 0.5)); width: 18px; height: 18px; }
    .crown-container:hover .crown-icon { filter: drop-shadow(0 0 8px var(--gold)) drop-shadow(0 0 20px var(--gold)); transform: scale(1.2) rotate(-10deg); }

    .chat-area { flex: 1; display: flex; flex-direction: column; width: 100%; background: var(--bg-main); height: 100%; }
    .chat-header { height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg-sidebar); }
    .back-btn { display: none; background: transparent; border: none; color: var(--accent); cursor: pointer; font-size: 30px; padding-right: 5px; align-items: center; }
    .chat-header h3 { font-size: 17px; font-weight: 600; }
    
    #messages-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 4px; -webkit-overflow-scrolling: touch; }
    .message-group { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
    .msg-author { font-size: 14px; font-weight: 600; color: var(--accent); margin-left: 12px; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
    .msg-author.creator { color: var(--gold); }
    .message { max-width: 75%; padding: 12px 16px; font-size: 16px; line-height: 1.4; word-wrap: break-word; }
    .message.sent { background: var(--bubble-sent); align-self: flex-end; border-radius: 18px 18px 4px 18px; color: white; }
    .message.received { background: var(--bubble-received); align-self: flex-start; border-radius: 18px 18px 18px 4px; border: 1px solid var(--border); }
    .message img { max-width: 100%; border-radius: 12px; margin-top: 4px; display: block; }
    .audio-player { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 20px; margin-top: 4px; }
    .play-btn { background: var(--accent); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
    
    .muted-warning { text-align: center; color: var(--danger); font-size: 14px; padding: 15px; background: rgba(239, 68, 68, 0.1); border-radius: 10px; margin: 10px; display: none; }
    .input-area { padding: 12px; display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--border); background: var(--bg-sidebar); }
    .input-wrapper { flex: 1; background: var(--bg-input); border-radius: 24px; display: flex; align-items: center; padding: 5px 5px 5px 15px; transition: 0.3s; }
    .input-wrapper input[type="text"] { flex: 1; padding: 10px 8px; background: transparent; border: none; color: var(--text-main); outline: none; font-size: 16px; }
    .recording-timer { color: var(--danger); font-weight: 600; font-size: 16px; padding: 0 10px; display: none; }
    .input-area.recording .input-wrapper { border: 1px solid var(--danger); background: rgba(239, 68, 68, 0.1); }
    .input-area.recording .input-wrapper input[type="text"] { display: none; }
    .input-area.recording .recording-timer { display: block; }
    .input-area.recording #btn-attach { display: none; }

    .btn-icon { width: 44px; height: 44px; background: transparent; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; border: none; border-radius: 50%; flex-shrink: 0; font-size: 22px; }
    .btn-icon.send-btn { background: var(--accent); color: white; }
    .btn-record.recording { color: white; background: var(--danger); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    #file-input, #avatar-input { display: none; }

    #bg-mute-btn { position: fixed; bottom: 20px; left: 20px; width: 50px; height: 50px; border-radius: 50%; background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-main); cursor: pointer; display: none; z-index: 50; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.2s; }
    #bg-mute-btn:hover { transform: scale(1.1); }
    #bg-mute-btn.pulsing { animation: radio-pulse 1s infinite; border-color: var(--accent); color: var(--accent); }
    @keyframes radio-pulse { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); } 70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal-content { background: var(--bg-sidebar); border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 1px solid var(--border); max-height: 80vh; display: flex; flex-direction: column; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .modal-header h3 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .close-modal { background: transparent; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
    .settings-section { margin-bottom: 20px; }
    .settings-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; font-weight: 600; }
    .theme-selector { display: flex; gap: 10px; }
    .theme-btn { flex: 1; padding: 12px; border: 2px solid var(--border); background: var(--bg-input); color: var(--text-main); border-radius: 12px; cursor: pointer; font-weight: 500; transition: 0.2s; font-size: 14px; }
    .theme-btn.active { border-color: var(--accent); color: var(--accent); }
    .avatar-upload { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .avatar-preview { width: 80px; height: 80px; border-radius: 50%; background: var(--bg-input); display: flex; align-items: center; justify-content: center; overflow: hidden; border: 3px solid var(--accent); }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
    .btn-upload-avatar { padding: 10px 20px; background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 14px; }

    .btn-wipe-all { width: 100%; padding: 12px; background: var(--danger); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; margin-bottom: 15px; font-size: 14px; }
    .btn-wipe-all:hover { filter: brightness(1.1); }
    .admin-actions { display: flex; gap: 6px; }
    .btn-adm { padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; border: 1px solid; background: transparent; }
    .btn-ban { border-color: var(--danger); color: var(--danger); }
    .btn-unban { border-color: var(--accent); color: var(--accent); }
    .btn-del { border-color: var(--text-muted); color: var(--text-muted); }
    .input-text { width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); margin-bottom: 10px; outline: none; font-size: 14px; }
    .btn-launch-radio { width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; margin-bottom: 10px; }

    @media (max-width: 920px) {
      #main-content { height: 100%; overflow: hidden; }
      .sidebar { width: 100%; position: absolute; top: 0; left: 0; height: 100%; z-index: 5; transition: transform 0.25s ease; border-right: none; }
      .chat-area { width: 100%; position: absolute; top: 0; left: 0; height: 100%; z-index: 10; transform: translateX(100%); transition: transform 0.25s ease; }
      #main-content.mobile-chat-open .sidebar { transform: translateX(-100%); }
      #main-content.mobile-chat-open .chat-area { transform: translateX(0); }
      .back-btn { display: flex; }
      .message { max-width: 85%; }
    }
  </style>
</head>
<body class="theme-dark">

  <div id="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">M</div>
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Вход</button>
        <button class="tab-btn" data-tab="register">Регистрация</button>
      </div>
      <div id="form-login" class="auth-form">
        <div class="input-group">
          <label for="login-phone">Номер телефона</label>
          <input type="tel" id="login-phone" placeholder="+7 (999) 123-45-67" value="+7" maxlength="18">
        </div>
        <div class="input-group">
          <label for="login-password">Пароль</label>
          <input type="password" id="login-password" placeholder="Введите пароль">
        </div>
        <button id="btn-login" class="btn-primary">Войти</button>
      </div>
      <div id="form-register" class="auth-form" style="display: none;">
        <div class="input-group">
          <label for="reg-phone">Номер телефона</label>
          <input type="tel" id="reg-phone" placeholder="+7 (999) 123-45-67" value="+7" maxlength="18">
        </div>
        <div class="input-group">
          <label for="reg-password">Пароль</label>
          <input type="password" id="reg-password" placeholder="Придумайте пароль (мин. 6 символов)">
        </div>
        <button id="btn-register" class="btn-primary">Зарегистрироваться</button>
      </div>
    </div>
  </div>

  <div id="app-container">
    <div id="top-nav">
      <div class="nav-logo">Messenger</div>
      <div class="nav-actions">
        <button id="admin-btn-top" class="nav-btn creator-btn" title="Управление">
          <svg class="crown-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
        </button>
        <button id="btn-settings" class="nav-btn" title="Настройки">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button id="btn-logout" class="nav-btn logout-btn" title="Выйти">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </div>

    <div id="main-content">
      <div class="sidebar">
        <div class="sidebar-header"><h2>Чаты</h2></div>
        <div class="search-input-wrap">
          <input type="tel" id="search-user" placeholder="Найти чат (номер)" value="+7" maxlength="18">
          <button class="search-btn-right" id="btn-search-user">🔍</button>
        </div>
        <div class="chat-list" id="chat-list">
          <div class="chat-item active" data-chat="global_chat_1" data-name="Общий чат">
            <div class="chat-avatar" style="background:#8b5cf6;">#</div>
            <div class="chat-info"><div class="chat-name">Общий чат</div><div class="chat-last">Чат для всех</div></div>
          </div>
        </div>
        <div class="user-profile">
          <div class="profile-avatar" id="profile-avatar-btn">U</div>
          <div class="profile-info" id="btn-settings-mobile">
            <div class="profile-name" id="current-user-name">Вы <span class="crown-container" id="creator-crown" style="display:none;"><svg class="crown-icon" viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg></span></div>
          </div>
        </div>
      </div>

      <div class="chat-area">
        <div class="chat-header">
          <button class="back-btn" id="back-btn">←</button>
          <h3 id="active-chat-name">Общий чат</h3>
        </div>
        <div class="muted-warning" id="muted-warning">⚠ Вы лишены права отправлять сообщения</div>
        <div id="messages-container"></div>
        <div class="input-area" id="input-area">
          <input type="file" id="file-input" accept="image/*">
          <div class="input-wrapper">
            <button class="btn-icon" id="btn-attach" title="Прикрепить фото">📎</button>
            <input type="text" id="message-text" placeholder="Написать сообщение...">
            <div class="recording-timer" id="recording-timer">0:00</div>
          </div>
          <button class="btn-icon send-btn" id="btn-send" title="Отправить">➤</button>
          <button class="btn-icon btn-record" id="btn-record" title="Записать голос">🎤</button>
        </div>
      </div>
    </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyApifDrGuoHFtdU1ZZtPRUWvkFgjMFyCEY",

    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const CREATOR_PHONE = "79254699801"; 
    let currentUserId = null, currentUserPhone = null, isUserMuted = false, activeChatId = "global_chat_1", currentUserAvatar = null;

    document.querySelectorAll('.tab-btn').forEach(btn => {

    });

    function applyPhoneMask(inputElement) {
      inputElement.addEventListener('input', (e) => {
        let input = e.target.value.replace(/\D/g, '');
        if (input.startsWith('8')) input = '7' + input.slice(1);
        if (input.startsWith('9')) input = '7' + input;
        input = input.substring(0, 11);
        let formatted = '';
        if (input.length > 0) formatted = '+7';
        if (input.length > 1) formatted += ' (' + input.substring(1, 4);
        if (input.length >= 5) formatted += ') ' + input.substring(4, 7);
        if (input.length >= 8) formatted += '-' + input.substring(7, 9);
        if (input.length >= 10) formatted += '-' + input.substring(9, 11);
        e.target.value = formatted;
      });
    }
    applyPhoneMask(document.getElementById('login-phone'));
    applyPhoneMask(document.getElementById('reg-phone'));
    applyPhoneMask(document.getElementById('search-user'));

    document.getElementById('btn-register').addEventListener('click', async () => {
      const phone = document.getElementById('reg-phone').value.replace(/\D/g, '');
      const password = document.getElementById('reg-password').value;
      if(!phone || phone.length < 11) return alert("Введите корректный номер телефона");
      if(!password || password.length < 6) return alert("Пароль: минимум 6 символов");
      const fakeEmail = `+${phone}@messenger.app`;
      try { 
        await auth.createUserWithEmailAndPassword(fakeEmail, password); 
        await db.collection('users').doc(auth.currentUser.uid).set({ phone: phone, uid: auth.currentUser.uid });
      } catch (regError) { 
        if (regError.code === 'auth/email-already-in-use') alert("Этот номер уже зарегистрирован!");
        else alert("Ошибка регистрации: " + regError.message); 
      }
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
      const phone = document.getElementById('login-phone').value.replace(/\D/g, '');
      const password = document.getElementById('login-password').value;
      if(!phone || phone.length < 11) return alert("Введите корректный номер телефона");
      if(!password) return alert("Введите пароль");
      const fakeEmail = `+${phone}@messenger.app`;
      try {
        await auth.signInWithEmailAndPassword(fakeEmail, password);
      } catch (error) {
        if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') alert("Неверный номер или пароль!");
        else alert("Ошибка входа: " + error.message);
      }
    });

    document.getElementById('btn-logout').addEventListener('click', () => auth.signOut());

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUserId = user.uid;
        currentUserPhone = user.email.split('@')[0].replace('+', ''); 
        try {
          const userDoc = await db.collection('users').doc(currentUserId).get();
          if (!userDoc.exists) {
            alert("Ваш профиль был удален администратором. Зарегистрируйтесь заново.");
            auth.signOut();
            return;
          }
          if (userDoc.data().avatar) {
            currentUserAvatar = userDoc.data().avatar;
            updateAvatarUI(currentUserAvatar);
          }
          if (userDoc.data().theme) applyTheme(userDoc.data().theme);

          if (currentUserPhone === CREATOR_PHONE) {
            document.getElementById('admin-btn-top').style.display = 'flex';
            document.getElementById('creator-crown').style.display = 'inline-flex';
            loadAdminUserList();
          } else {
            document.getElementById('admin-btn-top').style.display = 'none';
            document.getElementById('creator-crown').style.display = 'none';
          }
          
          if (!currentUserAvatar) document.getElementById('profile-avatar-btn').innerText = currentUserPhone.slice(-2);
          
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('app-container').style.display = 'flex';
          listenToMuteStatus();
          listenToMessages();
          listenToBgSound();
        } catch (dbError) {
          alert("Ошибка базы данных: " + dbError.message);
          auth.signOut();
        }
      } else {
        document.getElementById('auth-screen').style.display = 'flex';
        document.getElementById('app-container').style.display = 'none';
        document.getElementById('bg-mute-btn').style.display = 'none';
      }
    });

    // РАДИО ЛОГИКА
    function parseMediaUrl(url) {
      if (!url) return null;
      let ytMatch = url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      if (ytMatch) {
        const id = ytMatch[1];
        return { type: 'youtube', src: `https://www.youtube.com/embed/${id}?autoplay=1&loop=1&playlist=${id}&controls=0` };
      }
      if (url.includes('open.spotify.com/')) {
        const path = url.split('open.spotify.com/')[1].split('?')[0];
        return { type: 'spotify', src: `https://open.spotify.com/embed/${path}` };
      }
      return { type: 'audio', src: url };
    }

    let currentBgMedia = null;

    function listenToBgSound() {
      db.collection('settings').doc('radio').onSnapshot((doc) => {
        const data = doc.data();
        const muteBtn = document.getElementById('bg-mute-btn');
        const container = document.getElementById('bg-media-container');
        
        if (data && data.url) {
          currentBgMedia = parseMediaUrl(data.url);
          muteBtn.style.display = 'flex';
          muteBtn.classList.add('pulsing');
          muteBtn.innerText = '🔊';
          container.innerHTML = '';
        } else {
          currentBgMedia = null;
          container.innerHTML = '';
          muteBtn.style.display = 'none';
        }
      });
    }

    document.getElementById('bg-mute-btn').addEventListener('click', () => {
      const muteBtn = document.getElementById('bg-mute-btn');
      const container = document.getElementById('bg-media-container');
      
      if (!currentBgMedia) return;

      if (muteBtn.classList.contains('pulsing') || muteBtn.innerText === '🔊') {
        if (currentBgMedia.type === 'youtube' || currentBgMedia.type === 'spotify') {
          container.innerHTML = `<iframe src="${currentBgMedia.src}" allow="autoplay; encrypted-media" style="width:1px; height:1px;"></iframe>`;
        } else {
          container.innerHTML = `<audio src="${currentBgMedia.src}" autoplay loop></audio>`;
        }
        muteBtn.classList.remove('pulsing');
        muteBtn.innerText = '🔇';
      } else {
        container.innerHTML = '';
        muteBtn.innerText = '🔊';
        muteBtn.classList.add('pulsing');
      }
    });

    document.getElementById('btn-launch-radio').addEventListener('click', async () => {
      const url = document.getElementById('bg-sound-url').value.trim();
      if (!url) return alert("Вставьте ссылку!");
      try {
        await db.collection('settings').doc('radio').set({ url: url });
        alert("Радио запущено! У пользователей появится мигающая кнопка для включения.");
        document.getElementById('bg-sound-url').value = '';
      } catch (err) {
        alert("Ошибка: " + err.message);
      }
    });

    document.getElementById('btn-stop-bg').addEventListener('click', async () => {
      await db.collection('settings').doc('radio').delete();
      alert("Радио остановлено для всех!");
    });

    function listenToMuteStatus() {
      db.collection('users').doc(currentUserId).onSnapshot((doc) => {
        if (doc.exists) {
          isUserMuted = doc.data().isMuted || false;
          const warning = document.getElementById('muted-warning');
          const inputWrapper = document.querySelector('.input-wrapper');
          const btnRecord = document.getElementById('btn-record');
          const btnSend = document.getElementById('btn-send');
          if (isUserMuted) {
            warning.style.display = 'block'; inputWrapper.style.display = 'none'; btnRecord.style.display = 'none'; btnSend.style.display = 'none';
          } else {
            warning.style.display = 'none'; inputWrapper.style.display = 'flex'; btnRecord.style.display = 'flex'; btnSend.style.display = 'flex';
          }
        }
      });
    }

    function loadAdminUserList() {
      db.collection('users').onSnapshot((snapshot) => {
        const listContainer = document.getElementById('user-list-admin');
        listContainer.innerHTML = '';
        snapshot.forEach((doc) => {
          const userData = doc.data();
          if (userData.uid === currentUserId) return; 
          const isMuted = userData.isMuted || false;
          const item = document.createElement('div');
          item.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid var(--border); gap: 10px;';
          item.innerHTML = `
            <div style="display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden;">
              <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--bg-hover); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;">${userData.phone.slice(-2)}</div>
              <span style="font-size: 14px; color: var(--text-main); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${userData.phone}</span>
            </div>
            <div class="admin-actions">
              <button class="btn-adm ${isMuted ? 'btn-unban' : 'btn-ban'} btn-mute-toggle" data-uid="${userData.uid}" data-muted="${isMuted}">${isMuted ? 'Разбан' : 'Бан'}</button>
              <button class="btn-adm btn-del btn-delete-user" data-uid="${userData.uid}">Удалить</button>
            </div>
          `;
          listContainer.appendChild(item);
        });

        document.querySelectorAll('.btn-mute-toggle').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const uid = e.target.dataset.uid;
            const mutedStatus = e.target.dataset.muted === 'true';
            await db.collection('users').doc(uid).update({ isMuted: !mutedStatus });
          });
        });
        document.querySelectorAll('.btn-delete-user').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const uid = e.target.dataset.uid;
            if (confirm("Удалить профиль пользователя из базы?")) {
              await db.collection('users').doc(uid).delete();
            }
          });
        });
      });
    }

    document.getElementById('btn-wipe-db').addEventListener('click', async () => {
      if (!confirm("ВНИМАНИЕ! Будут удалены ВСЕ пользователи и ВСЕ сообщения. Восстановить нельзя. Продолжить?")) return;
      try {
        const usersSnap = await db.collection('users').get();
        usersSnap.forEach(async (doc) => { await doc.ref.delete(); });
        const msgSnap = await db.collection('chats/global_chat_1/messages').get();
        msgSnap.forEach(async (doc) => { await doc.ref.delete(); });
        await db.collection('settings').doc('radio').delete();
        alert("База данных очищена!");
        auth.signOut(); 
      } catch (e) { alert("Ошибка при удалении: " + e.message); }
    });

    const adminModal = document.getElementById('creator-modal');
    document.getElementById('admin-btn-top').addEventListener('click', () => adminModal.style.display = 'flex');
    document.getElementById('close-admin-modal').addEventListener('click', () => adminModal.style.display = 'none');
    adminModal.addEventListener('click', (e) => { if (e.target === adminModal) adminModal.style.display = 'none'; });

    const settingsModal = document.getElementById('settings-modal');
    const openSettings = () => settingsModal.style.display = 'flex';
    document.getElementById('btn-settings').addEventListener('click', openSettings);
    document.getElementById('btn-settings-mobile').addEventListener('click', openSettings);
    document.getElementById('profile-avatar-btn').addEventListener('click', openSettings);
    document.getElementById('close-settings-modal').addEventListener('click', () => settingsModal.style.display = 'none');
    settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) settingsModal.style.display = 'none'; });

    function applyTheme(themeName) {
      document.body.className = `theme-${themeName}`;
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === themeName);
      });
    }
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const theme = btn.dataset.theme;
        applyTheme(theme);
        try { await db.collection('users').doc(currentUserId).set({ theme: theme }, { merge: true }); } catch (e) {}
      });
    });

    document.getElementById('btn-upload-avatar').addEventListener('click', () => document.getElementById('avatar-input').click());
    document.getElementById('avatar-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = async function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const SIZE = 128;
          canvas.width = SIZE; canvas.height = SIZE;
          const minDim = Math.min(img.width, img.height);
          const sx = (img.width - minDim) / 2;
          const sy = (img.height - minDim) / 2;
          ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, SIZE, SIZE);
          const base64String = canvas.toDataURL('image/jpeg', 0.7);
          updateAvatarUI(base64String);
          try {
            await db.collection('users').doc(currentUserId).set({ avatar: base64String }, { merge: true });
            currentUserAvatar = base64String;
          } catch (err) { alert("Ошибка сохранения: " + err.message); }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    function updateAvatarUI(base64) {
      const html = `<img src="${base64}" alt="Аватар">`;
      document.getElementById('profile-avatar-btn').innerHTML = html;
      document.getElementById('avatar-preview').innerHTML = html;
    }

    async function searchUser() {
      let targetPhone = document.getElementById('search-user').value.replace(/\D/g, '');
      if (targetPhone.startsWith('8')) targetPhone = '7' + targetPhone.slice(1);
      if (!targetPhone || targetPhone.length < 11) return alert("Введите корректный номер");
      const snapshot = await db.collection('users').where('phone', '==', targetPhone).get();
      if (snapshot.empty) return alert("Пользователь не найден.");
      let targetUid = '';
      snapshot.forEach(doc => targetUid = doc.id);
      if (targetUid === currentUserId) return alert("Это вы сами.");
      const chatId = [currentUserId, targetUid].sort().join('_');
      addChatToList(chatId, `Чат (${targetPhone})`);
      document.getElementById('search-user').value = '+7';
    }
    document.getElementById('search-user').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchUser(); });
    document.getElementById('btn-search-user').addEventListener('click', searchUser);

    function addChatToList(chatId, name) {
      const list = document.getElementById('chat-list');
      if (document.querySelector(`.chat-item[data-chat="${chatId}"]`)) { selectChat(chatId, name); return; }
      const div = document.createElement('div');
      div.className = 'chat-item'; div.dataset.chat = chatId; div.dataset.name = name;
      div.innerHTML = `<div class="chat-avatar" style="background:#10b981;">U</div><div class="chat-info"><div class="chat-name">${name}</div><div class="chat-last">Личный чат</div></div>`;
      div.addEventListener('click', () => selectChat(chatId, name));
      list.prepend(div); selectChat(chatId, name);
    }

    document.querySelectorAll('.chat-item').forEach(item => {
      item.addEventListener('click', (e) => {
        const chatItem = e.currentTarget;
        selectChat(chatItem.dataset.chat, chatItem.dataset.name);
      });
    });

    function selectChat(chatId, name) {
      activeChatId = chatId;
      document.getElementById('active-chat-name').innerText = name;
      document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.querySelector(`.chat-item[data-chat="${chatId}"]`);
      if (activeEl) activeEl.classList.add('active');
      document.getElementById('main-content').classList.add('mobile-chat-open');
      listenToMessages();
    }

    document.getElementById('back-btn').addEventListener('click', () => document.getElementById('main-content').classList.remove('mobile-chat-open'));

    document.getElementById('btn-send').addEventListener('click', sendText);
    document.getElementById('message-text').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendText(); });
    async function sendText() {
      if (isUserMuted) return;
      const text = document.getElementById('message-text').value;
      if (!text.trim()) return;
      await db.collection(`chats/${activeChatId}/messages`).add({
        senderId: currentUserId, senderPhone: currentUserPhone, senderAvatar: currentUserAvatar,
        type: "text", content: text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      document.getElementById('message-text').value = '';
    }

    document.getElementById('btn-attach').addEventListener('click', () => document.getElementById('file-input').click());
    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (isUserMuted) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = async function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const MAX_WIDTH = 600;
          const scale = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scale;
          ctx.drawImage(img, 0, 0,canvas.width, canvas.height);
          const base64String = canvas.toDataURL('image/jpeg', 0.7);
          await db.collection(`chats/${activeChatId}/messages`).add({
            senderId: currentUserId, senderPhone: currentUserPhone, senderAvatar: currentUserAvatar,
            type: "image", content: base64String,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    let mediaRecorder, audioChunks = [], isRecording = false, timerInterval, seconds = 0;
    document.getElementById('btn-record').addEventListener('click', async () => {
      if (isUserMuted) return;
      const btnRecord = document.getElementById('btn-record');
      const inputArea = document.getElementById('input-area');
      const timerEl = document.getElementById('recording-timer');
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          let options = { mimeType: 'audio/webm' };
          if (!MediaRecorder.isTypeSupported('audio/webm')) options = { mimeType: 'audio/mp4' };
          mediaRecorder = new MediaRecorder(stream, options);
          mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
            audioChunks = [];
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = async () => {
              const base64data = reader.result;
              await db.collection(`chats/${activeChatId}/messages`).add({
                senderId: currentUserId, senderPhone: currentUserPhone, senderAvatar: currentUserAvatar,
                type: "audio", content: base64data,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
              });
            };
          };
          mediaRecorder.start();
          isRecording = true;
          btnRecord.classList.add('recording');
          inputArea.classList.add('recording');
          btnRecord.innerHTML = '⏹';
          seconds = 0;
          timerEl.innerText = "0:00";
          timerInterval = setInterval(() => {
            seconds++;
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            timerEl.innerText = `${m}:${s < 10 ? '0' + s : s}`;
            if (seconds >= 30) document.getElementById('btn-record').click();
          }, 1000);
        } catch (error) { alert("Нет доступа к микрофону."); }
      } else {
        clearInterval(timerInterval);
        mediaRecorder.stop();
        isRecording = false;
        btnRecord.classList.remove('recording');
        inputArea.classList.remove('recording');
        btnRecord.innerHTML = '🎤';
      }
    });

    let msgListener = null;
    function listenToMessages() {
      if (msgListener) msgListener(); 
      const q = db.collection(`chats/${activeChatId}/messages`).orderBy("timestamp", "asc");
      msgListener = q.onSnapshot((snapshot) => {
        const container = document.getElementById('messages-container');
        container.innerHTML = '';
        let lastSenderId = null;
        snapshot.forEach((doc) => {
          const msg = doc.data();
          const showAuthor = msg.senderId !== lastSenderId;
          lastSenderId = msg.senderId;
          const groupDiv = document.createElement('div');
          groupDiv.className = 'message-group';
          if (showAuthor && msg.senderId !== currentUserId) {
            let authorClass = msg.senderPhone === CREATOR_PHONE ? 'msg-author creator' : 'msg-author';
            let crownHtml = msg.senderPhone === CREATOR_PHONE ? ' <span class="crown-container"><svg class="crown-icon" style="width:14px;height:14px;" viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg></span>' : '';
            groupDiv.innerHTML += `<div class="${authorClass}">${msg.senderPhone}${crownHtml}</div>`;
          }
          const msgDiv = document.createElement('div');
          msgDiv.className = `message ${msg.senderId === currentUserId ? 'sent' : 'received'}`;
          if (msg.type === 'text') msgDiv.textContent = msg.content;
          else if (msg.type === 'image') msgDiv.innerHTML = `<img src="${msg.content}" alt="Фото">`;
          else if (msg.type === 'audio') {
            msgDiv.innerHTML = `
              <div class="audio-player">
                <button class="play-btn" onclick="this.parentNode.querySelector('audio').play()">▶</button>
                <audio src="${msg.content}" controls style="display:none;"></audio>
                <span style="font-size: 14px; color: var(--text-muted);">Голосовое сообщение</span>
              </div>
            `;
          }
          groupDiv.appendChild(msgDiv);
          container.appendChild(groupDiv);
        });
        container.scrollTop = container.scrollHeight;
      });
    }
  </script>
</body>
</html>
